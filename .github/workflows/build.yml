name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The platform-independent core: EPUB/ZIP/DEFLATE parsing, sentence
  # segmentation, lemmatisation and SM-2. Needs nothing but a JDK, so it is the
  # fastest signal that a change broke something.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        working-directory: tools/core-verify
        run: gradle test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: tools/core-verify/build/reports/tests/test

  android:
    runs-on: ubuntu-latest
    # Needed to publish the APK as a release asset.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/**/*.apk

      # Artifacts expire after 90 days and require a GitHub login to download.
      # A rolling release gives a permanent, direct link that anyone can fetch:
      #   .../releases/latest/download/BookReader.apk
      - name: Publish the APK as a rolling release
        if: github.ref_name == 'claude/new-repo-env-nyx6kq'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find composeApp/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "No release APK found to publish."
            exit 1
          fi
          cp "$apk" BookReader.apk
          echo "Publishing $(du -h BookReader.apk | cut -f1) APK"

          # Replace the previous rolling build rather than accumulating tags.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest BookReader.apk \
            --title "Book Reader — latest build" \
            --notes "Automatic build of \`${GITHUB_SHA:0:7}\`.

          Install on Android 8.0+ (enable \"install from unknown sources\").
          Signed with the debug key, so it installs directly but is not
          Play-Store ready — see README, Release signing.

          This binary is built and packaged by CI. Its runtime behaviour is
          only covered by the instrumented tests in the same run." 

  # Boots an emulator and actually runs the app. Everything else in this
  # workflow either tests pure logic or compiles; this is the only job where
  # the SQLDelight schema, the seeded dictionary, the repositories and the
  # first Compose composition execute.
  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # Hardware acceleration; without it the emulator is too slow to finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest --no-daemon

      # A test task with no tests still exits 0, so a misconfigured source set
      # would produce a green run that proves nothing. Count the executed tests
      # and fail if the suite was empty or anything failed.
      #
      # AGP names the result file "TEST-emulator-5554 - 11-_composeApp-.xml" —
      # with spaces — so the paths must never go through word splitting.
      - name: Assert the instrumented tests actually ran
        if: always()
        run: |
          find composeApp/build/outputs -name '*.xml' -path '*androidTest-results*' \
            -exec grep -ho 'tests="[0-9]*"' {} + > /tmp/t.txt || true
          find composeApp/build/outputs -name '*.xml' -path '*androidTest-results*' \
            -exec grep -ho 'failures="[0-9]*"' {} + > /tmp/f.txt || true
          find composeApp/build/outputs -name '*.xml' -path '*androidTest-results*' \
            -exec grep -ho 'errors="[0-9]*"' {} + > /tmp/e.txt || true
          total=$(grep -o '[0-9]*' /tmp/t.txt | awk '{s+=$1} END {print s+0}')
          failed=$(grep -o '[0-9]*' /tmp/f.txt | awk '{s+=$1} END {print s+0}')
          errors=$(grep -o '[0-9]*' /tmp/e.txt | awk '{s+=$1} END {print s+0}')
          echo "INSTRUMENTED RESULTS: tests=$total failures=$failed errors=$errors"
          if [ "$total" -lt 14 ]; then
            echo "Expected at least 14 instrumented tests, saw $total."
            exit 1
          fi
          if [ "$failed" -ne 0 ] || [ "$errors" -ne 0 ]; then
            echo "Instrumented tests failed."
            exit 1
          fi
          echo "All $total instrumented tests passed on the emulator."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report
          path: |
            composeApp/build/reports/androidTests/
            composeApp/build/outputs/androidTest-results/

      # Last thing in the job, on purpose. Emulator and Gradle output is long
      # enough that the result gets buried; repeating it here means the summary
      # and every failing test name are the final lines of the log.
      - name: Instrumented test summary
        if: always()
        run: |
          echo "===== INSTRUMENTED TEST SUMMARY ====="
          find composeApp/build/outputs -name '*.xml' -path '*androidTest-results*' \
            -exec grep -ho 'tests="[0-9]*" *failures="[0-9]*"[^>]*' {} + || echo "no results"
          echo "----- failures, if any -----"
          find composeApp/build/outputs -name '*.xml' -path '*androidTest-results*' \
            -exec grep -hB3 -E '<(failure|error)' {} + | head -40 || echo "(none)"

  ios:
    # Apple's toolchain is macOS-only; this job cannot run on a Linux runner.
    # macos-15 ships Xcode 16, which is required to read the project format
    # current XcodeGen emits (objectVersion 77). Xcode 15.4 on macos-14 refuses
    # to open it outright.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # The cache save/cleanup post-action logs ~150 lines at --info after
          # every step, which buries the xcodebuild diagnostics this job exists
          # to surface. Correctness of the build matters more here than a warm
          # cache.
          cache-disabled: true

      - name: Compile Kotlin for iOS
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # Unsigned simulator build. CI has no signing certificate, so this cannot
      # produce an installable .ipa — but it does prove the generated Xcode
      # project opens, links against the Kotlin framework, and compiles.
      - name: Build unsigned app for the simulator
        run: |
          set +e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/xcodebuild.log 2>&1
          status=$?

          # Surface just the diagnostics. xcodebuild is extremely verbose and
          # the surrounding Gradle output buries the one line that matters, so
          # print the errors on their own before anything else.
          echo "===== xcodebuild diagnostics (exit $status) ====="
          grep -nE "error:|ld: |framework not found|clang: error|Undefined symbol|\*\* BUILD FAILED" \
            /tmp/xcodebuild.log | head -40 || echo "(no matching diagnostic lines)"
          echo "===== last 60 lines ====="
          tail -60 /tmp/xcodebuild.log
          exit $status

      # The full log, so the linker failure can be diagnosed without re-running.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: warn
