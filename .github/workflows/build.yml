name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The platform-independent core: EPUB/ZIP/DEFLATE parsing, sentence
  # segmentation, lemmatisation and SM-2. Needs nothing but a JDK, so it is the
  # fastest signal that a change broke something.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        working-directory: tools/core-verify
        run: gradle test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: tools/core-verify/build/reports/tests/test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/**/*.apk

  ios:
    # Apple's toolchain is macOS-only; this job cannot run on a Linux runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin for iOS
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # Best-effort, and deliberately non-blocking.
      #
      # The job's real contract is the step above: the shared Kotlin must
      # compile for both iOS targets. Linking the Xcode host app is a weaker
      # signal — it cannot be code-signed on a CI runner, so it exercises a
      # configuration nobody ships, and a failure here says nothing about
      # whether the app code is correct. Run it for the diagnostics, but do not
      # let it gate the job. Build it in Xcode on a Mac to get a real answer.
      - name: Build unsigned app for the simulator (best-effort)
        continue-on-error: true
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
